# Style rules the tree already satisfies, so that a regression is caught at
# review time rather than found in a later sweep. Mirrors mtgban-website's
# and go-mtgban's config.

ignoreGeneratedHeader = false
severity = "error"
confidence = 0.8
errorCode = 1
warningCode = 1

[rule.blank-imports]
[rule.context-as-argument]
[rule.context-keys-type]
[rule.dot-imports]
[rule.empty-block]
[rule.error-naming]
[rule.error-return]
[rule.error-strings]
[rule.errorf]
[rule.exported]
[rule.increment-decrement]
[rule.indent-error-flow]
[rule.package-comments]
[rule.range]
[rule.receiver-naming]
[rule.redefines-builtin-id]
[rule.superfluous-else]
[rule.time-naming]
[rule.unexported-return]
[rule.unnecessary-format]
[rule.unchecked-type-assertion]
[rule.use-any]
[rule.use-errors-new]
[rule.use-waitgroup-go]
# The families named here report nothing a caller could act on: a CLI that
# cannot print to stdout or stderr has no one left to tell, a Close on the
# way out is cleanup, removing a partial file on a path that already returns
# the real error is best effort, and strings.Builder documents that its
# writes never fail.
[rule.unhandled-error]
  arguments = ["fmt.Print.*", "fmt.Fprint.*", "io.Closer.Close", "os.Remove",
               "strings.Builder.*"]
[rule.unreachable-code]
[rule.var-declaration]
[rule.var-naming]
[rule.imports-blocklist]
  arguments = ["reflect"]
