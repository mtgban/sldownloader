# Kept apart from new-sld-pr.yml so that pull request code never runs in a
# job that holds the sync tokens
name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get remove --purge man-db     # skip rebuilding caches
          sudo apt-get install -y tesseract-ocr libleptonica-dev libtesseract-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
