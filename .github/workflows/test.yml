# Kept apart from new-sld-pr.yml so that pull request code never runs in a
# job that holds the sync tokens
name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get remove --purge man-db     # skip rebuilding caches
          sudo apt-get install -y tesseract-ocr libleptonica-dev libtesseract-dev

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Revive
        run: go run github.com/mgechev/revive@v1.13.0 -set_exit_status -config .revive.toml ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
